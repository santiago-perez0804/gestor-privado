<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" />
    <title>Configuración</title>
    <style>
      :root {
        --bg: #f5f6f4;
        --surface: #ffffff;
        --surface-alt: #eef1ec;
        --border: #e1e5dd;
        --text: #171f1b;
        --text-muted: #5b6b62;
        --text-faint: #8b978e;
        --accent: #146356;
        --accent-soft: #e2efec;
        --warning: #b7770a;
        --warning-soft: rgba(245, 158, 11, 0.16);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10140f;
          --surface: #171e18;
          --surface-alt: #1d251e;
          --border: #29332a;
          --text: #edf2ec;
          --text-muted: #9caa9c;
          --text-faint: #6c7a6c;
          --accent: #45b69c;
          --accent-soft: #1e332c;
          --warning: #f0b84a;
          --warning-soft: rgba(245, 158, 11, 0.13);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      h2 {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--text-faint);
        margin: 0 0 6px 4px;
      }
      section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        margin-bottom: 16px;
        overflow: hidden;
      }
      label.row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        cursor: pointer;
      }
      label.row + label.row {
        border-top: 1px solid var(--border);
      }
      .row-text {
        flex: 1;
        min-width: 0;
      }
      .row-text small {
        display: block;
        color: var(--text-faint);
        font-size: 12px;
      }
      /* Interruptor */
      .switch {
        position: relative;
        width: 38px;
        height: 22px;
        flex-shrink: 0;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        inset: 0;
        margin: 0;
        cursor: pointer;
      }
      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        transition: background 0.15s;
      }
      .switch span::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
        transition: transform 0.15s;
      }
      .switch input:checked + span {
        background: var(--accent);
        border-color: var(--accent);
      }
      .switch input:checked + span::after {
        transform: translateX(16px);
      }
      .switch input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .switch input:disabled + span {
        opacity: 0.5;
      }
      .update {
        padding: 12px 14px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin-bottom: 10px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        flex-shrink: 0;
      }
      .stale .dot {
        background: var(--warning);
      }
      .stale .status-text {
        color: var(--warning);
      }
      .muted {
        color: var(--text-faint);
        font-size: 12px;
        margin: 0 0 10px;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 10px;
        padding: 9px 14px;
        cursor: pointer;
      }
      .primary {
        width: 100%;
        background: var(--accent);
        color: #fff;
      }
      .primary:hover {
        filter: brightness(1.08);
      }
      .link {
        background: none;
        color: var(--text-muted);
        padding: 4px;
        font-weight: 500;
        font-size: 12px;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1><span aria-hidden="true">🐸</span> Configuración</h1>

    <h2>General</h2>
    <section>
      <label class="row">
        <div class="row-text">
          Iniciar con Windows
          <small>El sapo y el gestor se abren solos al prender la compu.</small>
        </div>
        <div class="switch"><input type="checkbox" id="autoStart" /><span></span></div>
      </label>
    </section>

    <h2>Sapo</h2>
    <section>
      <label class="row">
        <div class="row-text">
          Mostrar al sapo
          <small>Si lo escondés, el gestor sigue andando en la bandeja.</small>
        </div>
        <div class="switch"><input type="checkbox" id="frogVisible" /><span></span></div>
      </label>
      <label class="row">
        <div class="row-text">
          Lengua traviesa
          <small>A veces agarra el mouse con la lengua.</small>
        </div>
        <div class="switch"><input type="checkbox" id="tongueEnabled" /><span></span></div>
      </label>
    </section>

    <h2>Actualizaciones</h2>
    <section id="updateBox" class="update">
      <div class="status"><span class="dot"></span><span class="status-text" id="statusText">…</span></div>
      <p class="muted" id="builtText"></p>
      <button class="primary" id="restart">Aplicar cambios y reiniciar</button>
    </section>

    <button class="link" id="openLog">Ver registro de errores</button>

    <script>
      const bridge = window.settingsBridge;
      const $ = (id) => document.getElementById(id);
      const fmt = new Intl.DateTimeFormat("es-AR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

      function render(state) {
        $("autoStart").checked = !!state.prefs.autoStart;
        $("tongueEnabled").checked = !!state.prefs.tongueEnabled;
        $("frogVisible").checked = !state.frogHidden;
        $("updateBox").classList.toggle("stale", state.stale);
        $("statusText").textContent = state.packaged
          ? "Versión instalada"
          : state.stale
            ? "Hay cambios en el código sin aplicar"
            : "Al día con el código";
        $("builtText").textContent = state.builtAt ? `Última compilación: ${fmt.format(new Date(state.builtAt))}` : "";
      }

      bridge.get().then(render);
      bridge.onChange(render);

      $("autoStart").addEventListener("change", (e) => bridge.set("autoStart", e.target.checked));
      $("tongueEnabled").addEventListener("change", (e) => bridge.set("tongueEnabled", e.target.checked));
      $("frogVisible").addEventListener("change", (e) => bridge.set("frogHidden", !e.target.checked));
      $("restart").addEventListener("click", (e) => {
        e.target.disabled = true;
        e.target.textContent = "Reiniciando…";
        bridge.restart();
      });
      $("openLog").addEventListener("click", () => bridge.openLog());
    </script>
  </body>
</html>
